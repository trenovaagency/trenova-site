.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}.btn.sm{padding:5px 10px;font-size:13px}.btn.red{background:var(--bad)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .lg{font-weight:800;letter-spacing:.08em;color:var(--p2);text-decoration:none}.top .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid transparent;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:26px;margin-top:4px}.kpi span{color:var(--mut);font-size:13px}
h2{margin:0 0 12px;font-size:18px}h3{margin:0 0 10px;font-size:15px;color:var(--p2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.bar>*{flex:1;min-width:140px}.bar .btn{flex:0 0 auto}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut);background:var(--bg2);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.avs{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#E879F9);color:#fff;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;position:relative;vertical-align:middle;margin-inline-end:8px}.avs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.s-active,.s-live{color:var(--ok);border-color:var(--ok)}.s-pending,.s-planned,.s-contacted{color:var(--warn);border-color:var(--warn)}.s-paused,.s-done,.s-new{color:var(--p2);border-color:var(--p2)}.s-blocked{color:var(--bad);border-color:var(--bad)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 .w{grid-column:1/-1}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.hide{display:none!important}
.lock{max-width:380px;margin:12vh auto;text-align:center}.lock .card{padding:26px}
.rowb{display:flex;gap:8px;align-items:center}.mut{color:var(--mut);font-size:13px}.empty{padding:28px;text-align:center;color:var(--mut)}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.hbar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--pink))}.hbar span:first-child{width:90px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{display:inline-flex;gap:5px;align-items:center;margin:0;color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}.chips input{width:auto}
</style>
</head>

function csvP(s){var r=[],row=[],f="",q=false;s=s.replace(/^\ufeff/,"");for(var i=0;i<s.length;i++){var c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0])r.push(row);row=[]}else f+=c}row.push(f);if(row.length>1||row[0])r.push(row);return r}
